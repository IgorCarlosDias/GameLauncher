name: "🏷️ Issue & PR Automation"

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

jobs:
  triage:
    name: Auto Triage & Welcome
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: 👋 Welcome First-time Contributors
        uses: actions/first-interaction@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: "Olá! 👋 Muito obrigado por abrir sua primeira Issue no repositório **GameLauncher**! Nossa equipe/mantenedor irá analisá-la em breve."
          pr-message: "Parabéns pelo seu primeiro Pull Request no **GameLauncher**! 🎉 Agradecemos muito a sua contribuição. A pipeline de CI iniciará a validação do seu código automaticamente."
